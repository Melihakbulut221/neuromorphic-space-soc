#
# Every number the paper prints, with what backs it.
#
# The paper's own thesis is that a green result gets read wider than what
# it looked at. A paper making that claim while printing figures nobody
# re-derives would be the thesis committed in its own text, so this file
# exists and paper/check_claims.py runs it.
#
# `check:` says how a claim is verified:
#   run      -- a command is executed and its output parsed; the value must match
#   blob     -- a git blob hash must match
#   file     -- a string must be present in a named file
#   manual   -- a human read an artefact once; the file and what was read are named
#   absent   -- the claim is that something does NOT exist, and that is checked
#
# A claim marked `manual` is NOT verified by the checker. It is recorded so
# that the paper cannot print an unattributed number, and so that the count
# of manual claims is visible rather than hidden.

claims:

  - id: replica.flops_per_bank
    value: 55
    text: "flip-flops in each of the three configuration TMR replicas"
    check: run
    cmd: "python3 hw/openlane/replica_placement.py hw/openlane/pilot_ihp/runs/signoff-6x2 --json"
    json_path: "flops_per_replica.u_pilot.u_cfg_a"
    needs_run_tree: true

  - id: replica.min_c2c_um
    value: 3.78
    text: "minimum cross-replica centre-to-centre distance, micrometres"
    check: run
    cmd: "python3 hw/openlane/replica_placement.py hw/openlane/pilot_ihp/runs/signoff-6x2 --json"
    json_path: "min_c2c_um"
    needs_run_tree: true

  - id: replica.min_edge_um
    value: 0.0
    text: "minimum cross-replica edge-to-edge distance, micrometres; the cells touch"
    check: run
    cmd: "python3 hw/openlane/replica_placement.py hw/openlane/pilot_ihp/runs/signoff-6x2 --json"
    json_path: "min_edge_um"
    needs_run_tree: true

  - id: replica.abutting_pairs
    value: 49
    text: "cross-replica flip-flop pairs whose cell outlines touch"
    check: run
    cmd: "python3 hw/openlane/replica_placement.py hw/openlane/pilot_ihp/runs/signoff-6x2 --json"
    json_path: "abutting_pairs"
    needs_run_tree: true

  - id: replica.nearest_is_other
    value: 103
    text: "of 165 configuration flip-flops whose nearest fellow is in a different replica"
    check: run
    cmd: "python3 hw/openlane/replica_placement.py hw/openlane/pilot_ihp/runs/signoff-6x2 --json"
    json_path: "nearest_is_another_replica"
    needs_run_tree: true

  - id: replica.unindexed
    value: 15
    text: "replica-C flip-flops that cannot be attributed to a bit, making the corresponding-bit figures a lower bound"
    check: run
    cmd: "python3 hw/openlane/replica_placement.py hw/openlane/pilot_ihp/runs/signoff-6x2 --json"
    json_path: "unindexed_per_replica.u_pilot.u_cfg_c"
    needs_run_tree: true

  - id: eqy.modules_proved
    value: 3
    text: "modules proved equivalent between RTL and the sign-off run's own cells"
    check: manual
    artefact: "formal/eqy/out/*.log after `make -C formal/eqy`"
    read: "tmr_voter 2 partitions, secded_enc 1, secded_dec 1, each ending DONE (PASS)"

  - id: eqy.controls_fail
    value: 2
    text: "negative controls that must not pass, and do not"
    check: manual
    artefact: "formal/eqy/out/voter_mutant.log, formal/eqy/out/secded_dec_mutant.log"
    read: "neither contains DONE (PASS); the Makefile treats a passing control as an error"

  # THIS CHECK USED TO BE `contains: "MIX"`, which is green on any file
  # that mentions the transform and cannot refute anything about the
  # width rule it was attached to. A review named it, correctly, as this
  # paper's own defect inside this paper's own checker. It now checks the
  # thing the paper's restriction actually rests on: that the module
  # refuses widths below four at elaboration.
  - id: tmr.width_guard_fires_below_four
    value: 1
    text: "the storage-transform bank refuses W < 4 at elaboration, which is why the counting rule is printed with its restriction"
    check: grep
    pattern: "ERROR_soc_tmr_bank_W_below_4_disarms_the_MIX_transform"
    paths: "hw/soc/rtl/soc_tmr_bank.v"

  - id: freeze.rtl_files
    value: 10
    text: "files in hw/rtl/, pinned by git blob in docs/34 section 2.1"
    check: run
    cmd: "bash -c 'ls hw/rtl | wc -l'"

  - id: freeze.blob_tmr_voter
    value: "e52580002bf6"
    text: "git blob of hw/rtl/tmr_voter.v after the licence headers"
    check: blob
    path: "hw/rtl/tmr_voter.v"

  # WAS `contains: "491"` over the whole file, which is green on any file
  # containing those digits anywhere -- including in a row the log keeps
  # standing precisely because it was WRONG. Named in review as one of
  # three checks in this registry that could not refute what they named.
  - id: suite.pytest
    value: 498
    text: "Python tests passing in the last recorded run"
    check: tsv
    file: "verification-log.tsv"
    column: "pytest_pass"

  - id: suite.pytest_fail
    value: 0
    text: "Python tests failing in the last recorded run"
    check: tsv
    file: "verification-log.tsv"
    column: "pytest_fail"

  - id: suite.cocotb
    value: 401
    text: "cocotb tests passing in the last recorded run"
    check: tsv
    file: "verification-log.tsv"
    column: "cocotb_pass"

  # A COUNT IS THE WRONG CLAIM HERE, and the first version of this file
  # made it anyway. "312 files carry a tag" was true when written and
  # false one commit later, which would have made the paper's own checker
  # cry wolf on every addition until someone stopped reading it. What the
  # paper actually asserts is a PROPERTY -- that no source file is
  # untagged or mis-tagged -- and a property does not drift.
  - id: spdx.no_untagged_source
    value: 0
    text: "source files that are untagged or tagged against the licence policy"
    check: run
    cmd: "python3 scripts/spdx_check.py"
    regex: "([0-9]+) missing"

  - id: spdx.no_wrong_tag
    value: 0
    text: "source files carrying a tag the policy does not allow for their class"
    check: run
    cmd: "python3 scripts/spdx_check.py"
    regex: "([0-9]+) wrong"

  - id: pdk.sram_magic_errors
    value: 1106478
    text: "Magic DRC error boxes returned by one RM_IHPSG13 macro, all inside vendor geometry"
    check: manual
    artefact: "docs/12 section 7.5"
    read: "the count, recorded when the macro was integrated; the blocker is upstream, IHP-Open-PDK issue 239"

  - id: soc.setup_violating_endpoints
    value: 3088
    text: "slow-corner setup endpoints the SoC layout fails"
    check: manual
    artefact: "docs/77 section 9.2, run s77gate"
    read: "-4.6799 ns WNS on 3,088 violating endpoints"

  # WAS a glob for `**/*.gds.fabricated`, an extension no tool in this
  # flow emits, so the check could never have failed. A claim about the
  # world is not checkable from a repository; what IS checkable is that
  # the corpus states it, and the rest is the reader's to take on the
  # author's word. Named as such rather than dressed as a measurement.
  - id: silicon.absence_is_stated
    value: 1
    text: "the datasheet states, in its own first section, that no silicon exists"
    check: grep
    pattern: "no silicon"
    paths: "docs/60-soc-datasheet.md"

  # Section 8's configuration claims. These are the sharpest kind of
  # evidence available for a scope defect: the scope is a value in a file
  # the run itself wrote, so the claim is a lookup rather than a reading.

  - id: scope.checker_all_corners
    value: "['*']"
    text: "SETUP_VIOLATION_CORNERS -- the checker is bound to every corner"
    check: json
    file: hw/soc/pnr/runs/s77gate/resolved.json
    key: SETUP_VIOLATION_CORNERS

  - id: scope.repair_typ_only
    value: "['*typ*']"
    text: "TIMING_VIOLATION_CORNERS -- the repair is bound to the typical corner alone, while the checker above is bound to all three"
    check: json
    file: hw/soc/pnr/runs/s77gate/resolved.json
    key: TIMING_VIOLATION_CORNERS

  - id: scope.placement_not_timing_driven
    value: "False"
    text: "PL_TIMING_DRIVEN -- global placement did not consider timing at all"
    check: json
    file: hw/soc/pnr/runs/s77gate/resolved.json
    key: PL_TIMING_DRIVEN

  - id: decks.magic_off
    value: "False"
    text: "RUN_MAGIC_DRC on the system-on-chip: the deck was switched off, not run and failed"
    check: json
    file: hw/soc/pnr/runs/s77gate/resolved.json
    key: RUN_MAGIC_DRC

  - id: decks.lvs_off
    value: "False"
    text: "RUN_LVS on the system-on-chip"
    check: json
    file: hw/soc/pnr/runs/s77gate/resolved.json
    key: RUN_LVS

  - id: soc.meets_at_typ
    value: "4.3153"
    text: "setup worst slack at the typical corner, nanoseconds -- the design meets there and fails only at slow"
    check: manual
    artefact: "hw/soc/pnr/runs/s77gate/50-openroad-stapostpnr/summary.rpt"
    read: "the Overall row gives -4.6799 with 3,088 violating endpoints; nom_typ gives +4.3153 with 0 and nom_fast +9.5579 with 0"

  - id: soc.worst_path_slew
    value: "1.611246"
    text: "output transition of one minimum-strength nand3 on the worst path, nanoseconds"
    check: manual
    artefact: "hw/soc/pnr/runs/s77gate/50-openroad-stapostpnr/nom_slow_1p08V_125C/max.rpt"
    read: "cell _42330_ (sg13g2_nand3_1), slew 1.611246, delay 1.396062, driving 0.118899 pF"

  # The paper says a wording sweep was made. An earlier draft said it had
  # been made when it had not, which is this paper's own subject committed
  # in the sentence announcing the fix. This is the check that keeps the
  # claim honest: it counts what is LEFT, over the live documents only --
  # historical run records keep their wording by docs/64's rule, and the
  # frozen shuttle text is a decision recorded in docs/21 section 6.6
  # rather than an edit.
  - id: tmr.no_unqualified_die_claim
    value: 0
    text: "live documents still calling the configuration state protected by TMR without the netlist qualifier"
    check: grep
    pattern: "state is now protected || is now protected**, which || The backstop is protected"
    paths: "README.md, ROADMAP.md, docs/5*.md, docs/6*.md, docs/7*.md

  # Section 8's measurements. The two deck splits are the strongest
  # numbers in this paper that a reader can check without re-running a
  # seventeen-hour job: the run directories are gitignored build output,
  # so these are pinned by digest in docs/80 and read from the run's own
  # metrics here.

  - id: decks.magic_outside
    value: 0
    text: "Magic DRC error boxes falling outside the six vendor SRAM macro footprints"
    check: manual
    artefact: "hw/soc/pnr/runs/s77gate-drc-full/classification.txt"
    read: "39,969,214 boxes, 39,969,214 inside, 0 straddling, 0 outside, 0 outside the die; the classifier reproduces the earlier single-macro report's 1,106,478 before being pointed here"

  - id: decks.klayout_outside
    value: 0
    text: "KLayout DRC items naming a cell outside the vendor macro hierarchy"
    check: manual
    artefact: "hw/soc/pnr/runs/s77gate-klayoutdrc/reports/drc.klayout.lyrdb"
    read: "9,668 items in 3 of 173 rules; all 60 base cell names are RM_IHPSG13_1P_* or RSC_IHPSG13_*; not one names soc_top or any sg13g2_* standard cell"

  - id: decks.lvs_matches
    value: 1
    text: "Netgen LVS reports the circuits match uniquely with the macros abstracted"
    check: grep
    pattern: "Circuits match uniquely"
    paths: "hw/soc/pnr/runs/s77lvs-b-blackbox/*/*.log, hw/soc/pnr/runs/s77lvs-b-blackbox/reports/*"

  - id: timing.closes_at
    value: "25.00"
    text: "clock period, nanoseconds, at which this layout closes setup at the slow corner with zero violating endpoints"
    check: manual
    artefact: "hw/soc/pnr/runs/s81-sta-compare/"
    read: "an OpenSTA sweep on the final netlist and SPEF reproduces sign-off at 20.00 ns (-4.6799, 3088) and gives +0.3201 with TNS 0 and 0 endpoints at 25.00 ns; the run's own clock.rpt says period_min = 24.68"

  - id: timing.repair_did_not_close
    value: "-3.030638936699411"
    text: "slow-corner setup worst slack after the repair; it improved and did not close"
    check: json
    file: hw/soc/pnr/runs/s81timing/final/metrics.json
    key: "timing__setup__ws__corner:nom_slow_1p08V_125C"

  - id: timing.drv_alone_made_it_worse
    value: "-5.214497425892334"
    text: "slow-corner worst slack with the explicit transition and capacitance limits alone, against a baseline of -4.6799: the diagnosis ranked this repair first"
    check: json
    file: hw/soc/pnr/runs/s81drv/final/metrics.json
    key: "timing__setup__ws__corner:nom_slow_1p08V_125C"

  - id: timing.ptd_alone
    value: "-3.355394279620113"
    text: "slow-corner worst slack with timing-driven placement alone"
    check: json
    file: hw/soc/pnr/runs/s81ptd/final/metrics.json
    key: "timing__setup__ws__corner:nom_slow_1p08V_125C"

  # A claim about this repository's own continuous integration, which is
  # the thing the paper was asserting without looking. It is checked the
  # only way it can be from inside the tree: the workflow files exist.
  # Whether they RUN is not knowable from here, which is the point, and
  # section 12 states the observed answer instead.
  - id: ci.workflows_are_configured
    value: 3
    text: "workflow files configured to run the checks; whether they execute is not checkable from the repository and section 12 reports that they have not since 2026-09-03"
    check: grep
    pattern: "workflow_dispatch"
    paths: ".github/workflows/*.yml"
