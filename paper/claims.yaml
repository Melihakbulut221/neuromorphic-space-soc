#
# Every number the paper prints, with what backs it.
#
# The paper's own thesis is that a green result gets read wider than what
# it looked at. A paper making that claim while printing figures nobody
# re-derives would be the thesis committed in its own text, so this file
# exists and paper/check_claims.py runs it.
#
# `check:` says how a claim is verified:
#   run      -- a command is executed and its output parsed; the value must match
#   blob     -- a git blob hash must match
#   file     -- a string must be present in a named file
#   manual   -- a human read an artefact once; the file and what was read are named
#   absent   -- the claim is that something does NOT exist, and that is checked
#
# A claim marked `manual` is NOT verified by the checker. It is recorded so
# that the paper cannot print an unattributed number, and so that the count
# of manual claims is visible rather than hidden.

claims:

  - id: replica.flops_per_bank
    value: 55
    text: "flip-flops in each of the three configuration TMR replicas"
    check: run
    cmd: "python3 hw/openlane/replica_placement.py hw/openlane/pilot_ihp/runs/signoff-6x2 --json"
    json_path: "flops_per_replica.u_pilot.u_cfg_a"
    needs_run_tree: true

