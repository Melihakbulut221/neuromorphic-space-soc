  # The paper says a wording sweep was made. An earlier draft said it had
  # been made when it had not, which is this paper's own subject committed
  # in the sentence announcing the fix. This is the check that keeps the
  # claim honest: it counts what is LEFT, over the live documents only --
  # historical run records keep their wording by docs/64's rule, and the
  # frozen shuttle text is a decision recorded in docs/21 section 6.6
  # rather than an edit.
  # NARROWED 2026-09-12, and the claim text is what changed rather than
  # the check. This read "live documents still calling the configuration
  # state protected by TMR without the netlist qualifier" -- a statement
  # about a PROPERTY of the corpus -- while the check is three literal
  # phrases grepped over five path globs. Those are not the same thing
  # and the gap is the whole subject of docs/81: a green result read
  # wider than what it looked at.
  #
  # The check is kept as it is, deliberately. Strengthening it means
  # deciding mechanically what "calling the state protected" looks like
  # in English, which is a judgement no grep makes and a wrong one would
  # either fire constantly or never. What is fixed is the claim: it now
  # says what the three phrases are and that the property itself is not
  # checked, so a reader cannot take the zero for more than it is.
  - id: tmr.no_unqualified_die_claim
    value: 0
    text: "occurrences of the three phrases that carried the unqualified TMR claim -- NOT a check that no document makes it some other way"
    check: grep
    pattern: "state is now protected || is now protected**, which || The backstop is protected"
    paths: "README.md, ROADMAP.md, docs/5*.md, docs/6*.md, docs/7*.md"
    # WHAT THIS DOES NOT COVER, stated because the number is a zero and a
    # zero invites the wider reading: a document that makes the same
    # claim in different words, one outside these five globs, and the
    # sixteen documents below docs/50. The three phrases are the ones
    # the 2026-09-08 sweep actually found and removed; this guards the
    # regression, not the class.

