  # THIS CHECK USED TO BE `contains: "MIX"`, which is green on any file
  # that mentions the transform and cannot refute anything about the
  # width rule it was attached to. A review named it, correctly, as this
  # paper's own defect inside this paper's own checker. It now checks the
  # thing the paper's restriction actually rests on: that the module
  # refuses widths below four at elaboration.
  - id: tmr.width_guard_fires_below_four
    value: 1
    text: "the storage-transform bank refuses W < 4 at elaboration, which is why the counting rule is printed with its restriction"
    check: grep
    pattern: "ERROR_soc_tmr_bank_W_below_4_disarms_the_MIX_transform"
    paths: "hw/soc/rtl/soc_tmr_bank.v"

  - id: freeze.rtl_files
    value: 10
    text: "files in hw/rtl/, pinned by git blob in docs/34 section 2.1"
    check: run
    cmd: "bash -c 'ls hw/rtl | wc -l'"

  - id: freeze.blob_tmr_voter
    value: "e52580002bf6"
    text: "git blob of hw/rtl/tmr_voter.v after the licence headers"
    check: blob
    path: "hw/rtl/tmr_voter.v"

  # WAS `contains: "491"` over the whole file, which is green on any file
  # containing those digits anywhere -- including in a row the log keeps
  # standing precisely because it was WRONG. Named in review as one of
  # three checks in this registry that could not refute what they named.
  # It was then re-pinned to the LAST ROW by column name, which fixed the
  # substring defect and left a worse one standing:
  #
  #   `suite.pytest: 498` and `suite.cocotb: 401` compared a literal
  #   against whatever row happens to be last. That row was recorded at
  #   5186107, which is not HEAD, on a tree its own notes field calls
  #   tree-dirty=20,frozen-dirty=3. Green there means "the last recording
  #   still says what it said" and was being read as "the suite passes
  #   here, now" -- a result read wider than what it looked at, in the
  #   registry this paper built to stop that.
  #
  # Re-pinning is not available: a new row is written by scripts/verify.sh,
  # which is half an hour and now exits non-zero on formal_other=35
  # because the recorder was widened to the whole tree, so there is no
  # clean row to pin to. What the paper actually asserts about the suites
  # is that they are RECORDED rather than asserted. That is a property and
  # it does not drift, so these are properties now. A pass count for this
  # tree is not claimed anywhere, because nothing here has measured one.

  - id: suite.no_pytest_failures_recorded
    value: 0
    text: "failing Python tests in the last recorded run, whichever run that is and whatever commit it was recorded at"
    check: tsv
    file: "verification-log.tsv"
    column: "pytest_fail"

  - id: suite.no_cocotb_failures_recorded
    value: 0
    text: "failing cocotb tests in the last recorded run, whichever run that is"
    check: tsv
    file: "verification-log.tsv"
    column: "cocotb_fail"

  - id: suite.last_row_names_a_real_commit
    value: "commit"
    text: "the last verification-log row names a commit that exists in this repository, which is what makes the row a record rather than an assertion -- it is NOT necessarily HEAD, and the paper does not say it is"
    check: run
    cmd: "h=$(tail -1 verification-log.tsv | cut -f2); case $h in upstream:*) echo upstream ;; *) git cat-file -t $h ;; esac"
    unchecked_when: "upstream"
    unchecked_why: "the generated mirror shares no history with the repository the measurement was taken in, so its head column carries the upstream hash prefixed; the row is traceable by hand and not by git"

  - id: suite.superseded_rows_stand
    value: 1
    text: "the correcting row that names the two overcounted cocotb rows Appendix B withdraws; both bad rows are still in the log, which is docs/64's rule applied to a measurement rather than to prose"
    check: grep
    pattern: "supersedes=two-invalid-rows-for-1ecf509-concurrent-run-overcount"
    paths: "verification-log.tsv"

  - id: suite.cocotb_at_the_corrected_row
    value: 401
    text: "cocotb tests passing in the row that supersedes the two overcounted ones -- the 401 Appendix B prints, read from the historical row it belongs to rather than from whichever row is last"
    check: run
    cmd: "grep supersedes= verification-log.tsv | cut -f5"

  # A COUNT IS THE WRONG CLAIM HERE, and the first version of this file
  # made it anyway. "312 files carry a tag" was true when written and
  # false one commit later, which would have made the paper's own checker
  # cry wolf on every addition until someone stopped reading it. What the
  # paper actually asserts is a PROPERTY -- that no source file is
  # untagged or mis-tagged -- and a property does not drift.
  - id: spdx.no_untagged_source
    value: 0
    text: "source files that are untagged or tagged against the licence policy"
    check: run
    cmd: "python3 scripts/spdx_check.py"
    regex: "([0-9]+) missing"

  - id: spdx.no_wrong_tag
    value: 0
    text: "source files carrying a tag the policy does not allow for their class"
    check: run
    cmd: "python3 scripts/spdx_check.py"
    regex: "([0-9]+) wrong"

