  # A claim about this repository's own continuous integration, which is
  # the thing the paper was asserting without looking. Whether a workflow
  # RUNS is not knowable from inside the tree -- section 12 states the
  # observed answer, which is that none has since 2026-09-03. What IS
  # checkable, and is the property that matters after that discovery, is
  # that the workflow does not define its own copy of any check: it calls
  # the same script the developer runs, so the two cannot drift.
  - id: ci.workflow_calls_the_local_script
    value: 1
    text: "the workflow invokes scripts/ci_local.sh rather than defining its own copy of any check"
    check: grep
    pattern: "scripts/ci_local.sh all"
    paths: ".github/workflows/*.yml"
