; Repository-root pytest configuration.
;
; sw/tests/ is THE pytest tree. Several other directories hold files named
; test_*.py that pytest must not execute:
;
;   hw/tb/   cocotb test modules. The simulator process started by
;            hw/tb/Makefile loads them; they import cocotb and talk to a
;            live design handle, and the root virtualenv deliberately has
;            no cocotb (docs/11 section 3.2 keeps the two environments
;            apart), so a bare pytest cannot even import them.
;   tt/      a vendored third-party checkout with its own suite and its
;            own dependencies (klayout and friends), run by that project's
;            tooling.
;
; testpaths states the positive rule -- collect sw/tests, and nothing else
; -- so a sibling tree added later is out of scope the day it is created,
; with no edit here. conftest.py's collect_ignore states the negative rule
; for the same directories and still earns its place: testpaths applies
; only when pytest is invoked from the rootdir with no arguments, so an
; explicit `pytest .` at the root goes through collect_ignore instead. The
; two together cover both, and neither is a substitute for the other.
;
; Invocations this file must not break, all verified:
;
;   .venv/bin/python -m pytest                  (root, testpaths)
;   .venv/bin/python -m pytest .                (root, collect_ignore)
;   .venv/bin/python -m pytest sw/tests/        (explicit path)
;   cd sw     && ../.venv/bin/python -m pytest  (invocation dir is an arg)
;   cd sw/tests && ../../.venv/bin/python -m pytest
;   hw/.venv running hw/tb through the cocotb makefiles, which do not use
;   pytest for collection at all, and an explicit
;   `hw/.venv/bin/python -m pytest hw/tb/<file>.py` in that virtualenv,
;   where the path is given on the command line and testpaths is not
;   consulted.
;
; This file also pins the rootdir to the repository root for every one of
; those invocations, which is what keeps sw/tests importable as a package
; from inside sw/ and sw/tests/.
;
; One knock-on effect, measured and benign: `cd tt && pytest` now reports
; rootdir as the repository root instead of tt/, and prints paths relative
; to it. It collects exactly the same 54 tt tests either way, and the
; klayout import error in tt/precheck is a missing dependency of the root
; virtualenv in both cases -- tt/ is vendored and is run by its own
; tooling in its own environment, so nothing there depends on this.
;
; Deliberately minimal: no addopts, no plugin requirements. Anything that
; changes how a test runs belongs in the test, not here.

[pytest]
testpaths = sw/tests
