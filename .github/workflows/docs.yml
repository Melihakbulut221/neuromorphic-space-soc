name: docs

# Builds the document site from docs/*.md, README.md and ROADMAP.md on
# every push, and uploads it as a workflow artifact.
#
# Modelled on gonsolo/borg's .github/workflows/book.yaml, with two
# deliberate differences.
#
# 1. NO GITHUB PAGES DEPLOY. borg's workflow ends with an
#    actions/deploy-pages step; this one stops at upload-artifact. Two
#    reasons, both current as of 2026-08-26:
#
#      * This repository is private, and stays private.
#      * ~~docs/14-licensing-decision.md is UNSIGNED.~~ **Signed
#        2026-09-09.** That half of the reason is gone: the corpus now
#        has a licence (CC-BY-4.0) and could be published.
#
#    UPDATED 2026-09-09. The second reason is replaced rather than
#    removed, and the deploy stays off. docs/14 section 11 chose a
#    CURATED PUBLIC MIRROR over making this repository public, so the
#    published site belongs to the mirror's workflow, not to this one.
#    Deploying from here would publish this repository's tree, which is
#    the thing that decision declined -- and it would publish docs/05
#    section 3, docs/06 and docs/13, which LICENSES.md section 2.1
#    holds back.
#
#    So this file still stops at upload-artifact, and the reason is now
#    scope rather than licence. The mirror is where a Pages deploy
#    belongs, over the published subset only.
#
# 2. No build_book.py snippet resolution and no Mermaid loader. Our
#    corpus has no snippet directives, no diagrams and, before
#    scripts/build_docs.py, no links at all; docs/19-ci-parity-borg.md
#    section 3.6 measured that. What it does have is several hundred
#    bare "docs/NN" cross-references, so our generator's job is link
#    resolution rather than snippet expansion.
#
# The gate step follows the pattern docs/19 section 6 recommends
# copying from borg's gds-wafer-space workflow: state the pass condition
# as a machine-checked assertion in the workflow, rather than leaving a
# human to read the log.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Link integrity
        # Every cross-reference names a file that exists, and every
        # document is reachable from docs/00-index.md. This runs before
        # the build so a broken reference fails as a link error rather
        # than as a missing page.
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest sw/tests/test_doc_links.py -q

      - name: Build site (pandoc)
        run: python3 scripts/build_docs.py --out _site --renderer pandoc

      - name: Gate on the build result
        # The pass condition, machine-checked: a page per source
        # document, and the cross-references actually resolved. The
        # threshold is a floor, not the exact count -- the corpus grows.
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          site = pathlib.Path("_site")
          manifest = json.loads((site / "manifest.json").read_text())

          sources = sorted(pathlib.Path("docs").glob("*.md"))
          expected = len(sources) + 2  # README.md and ROADMAP.md

          failures = []
          if manifest["documents"] != expected:
              failures.append(
                  f"built {manifest['documents']} documents, expected {expected}"
              )
          if manifest["backend"] != "pandoc":
              failures.append(f"backend was {manifest['backend']}, expected pandoc")
          if manifest["cross_references_resolved"] < 500:
              failures.append(
                  f"only {manifest['cross_references_resolved']} cross-references "
                  "resolved; the corpus carries several hundred"
              )
          for name in ("index.html", "all-documents.html", "style.css"):
              if not (site / name).is_file():
                  failures.append(f"missing {name}")

          for f in failures:
              print(f"FAIL: {f}")
          print(
              f"{manifest['documents']} documents, "
              f"{manifest['cross_references_resolved']} cross-references resolved, "
              f"backend {manifest['backend']}"
          )
          sys.exit(1 if failures else 0)
          PY

      - name: Build site (no pandoc) as a degradation check
        # scripts/build_docs.py must still produce a usable site where
        # pandoc is absent, which is the case in the developer's local
        # rootless environment. Building both ways here keeps that path
        # from rotting unnoticed.
        run: |
          python3 scripts/build_docs.py --out _site_builtin --renderer builtin
          test -s _site_builtin/index.html

      - name: Upload site artifact
        # Artifact only. See the header comment: no Pages deploy while
        # the licence decision in docs/14 is unsigned.
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 30
