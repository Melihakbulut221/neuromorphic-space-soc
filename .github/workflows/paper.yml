name: paper

# Builds paper/main.tex and re-derives every number it prints.
#
# Two jobs, and the second is the one that matters. A paper arguing that
# green results get read wider than what they looked at, printing figures
# nobody re-derives, would be its own thesis committed in its own text.
# paper/check_claims.py re-derives what can be re-derived and reports the
# rest as read-by-hand rather than passing them silently.
#
# The build job exists because there is no TeX installation on the machine
# this paper was written on, so "it compiles" would otherwise be an
# assumption. It is not a claim about the content.

on:
  push:
    paths: ['paper/**', '.github/workflows/paper.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install a TeX distribution
        run: |
          sudo apt-get update -qq
          # texlive-science carries siunitx and texlive-latex-extra does
          # not; lmodern.sty is in the `lmodern` package, which
          # texlive-base only RECOMMENDS and --no-install-recommends
          # therefore drops. Without both, pdflatex exits non-zero on the
          # first \usepackage and no run of this workflow could ever have
          # been green -- which made "it compiles" the assumed claim this
          # job exists to stop being one. Found in review, 2026-09-09.
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science lmodern

      - name: Build the paper
        working-directory: paper
        run: make

      - name: The bibliography must not be empty
        working-directory: paper
        run: |
          set -eu
          # arXiv does not run BibTeX: it compiles the tarball as given,
          # so a missing main.bbl renders all 29 citations as [?] -- and
          # that is a WARNING, so an unchecked build goes green on an
          # empty bibliography. Fail here instead.
          test -s main.bbl || { echo "main.bbl absent: arXiv would render [?]"; exit 1; }
          if grep -qE 'Citation .* undefined|There were undefined references' main.log; then
            grep -nE 'Citation .* undefined|undefined references' main.log
            exit 1
          fi
          echo "bibliography resolved, $(grep -c '^.bibitem' main.bbl) entries"

      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/main.pdf

  claims:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-derive the numbers the paper prints
        run: python3 paper/check_claims.py

      - name: No claim may be unattributed
        run: |
          set -eu
          # Every claim must name either a command or an artefact. A claim
          # with neither is a number with nothing behind it, which is the
          # thing this whole file exists to prevent.
          python3 - <<'PY'
          import sys, pathlib
          sys.path.insert(0, "paper")
          from check_claims import load
          bad = []
          for c in load(pathlib.Path("paper/claims.yaml")):
              if c.get("check") == "manual":
                  if not c.get("artefact"):
                      bad.append(c["id"])
              elif not (c.get("cmd") or c.get("path") or c.get("file")
                        or c.get("glob")):
                  bad.append(c["id"])
          if bad:
              print("claims with nothing behind them: " + ", ".join(bad))
              sys.exit(1)
          print("every claim names a command or an artefact")
          PY
